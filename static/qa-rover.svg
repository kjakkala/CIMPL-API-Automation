<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" role="img" aria-labelledby="title description">
  <title id="title">A colorful QA robot</title>
  <desc id="description">A cheerful robot with a magnifying glass, waving and walking.</desc>
  <style>
    .left-leg { animation: step .34s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }
    .right-leg { animation: step .34s ease-in-out infinite alternate-reverse; transform-box: fill-box; transform-origin: top center; }
    .arm { animation: wave .55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 15% 80%; }
    .eyes { animation: blink 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes step { to { transform: rotate(20deg); } }
    @keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(15deg); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.12); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
  <ellipse cx="80" cy="181" rx="47" ry="6" fill="#dbe5f1"/>
  <path d="M69 30v-13m22 13V14" stroke="#1654a5" stroke-linecap="round" stroke-width="4"/>
  <circle cx="69" cy="13" r="6" fill="#f38181"/>
  <circle cx="91" cy="13" r="6" fill="#ffc857"/>
  <circle cx="47" cy="55" r="7" fill="#f38181"/>
  <circle cx="113" cy="55" r="7" fill="#f38181"/>
  <rect x="45" y="33" width="70" height="55" rx="18" fill="#ffc857" stroke="#1654a5" stroke-width="5"/>
  <g class="eyes">
    <ellipse cx="66" cy="56" rx="4" ry="7" fill="#172b4d"/>
    <ellipse cx="94" cy="56" rx="4" ry="7" fill="#172b4d"/>
  </g>
  <path d="M69 72q11 12 22 0" fill="none" stroke="#a23b36" stroke-linecap="round" stroke-width="3"/>
  <rect x="50" y="91" width="60" height="55" rx="15" fill="#73c8a9" stroke="#1654a5" stroke-width="5"/>
  <rect x="66" y="105" width="28" height="20" rx="5" fill="#fff"/>
  <path d="m72 115 5 5 11-12" fill="none" stroke="#2574db" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <circle cx="80" cy="136" r="3" fill="#1654a5"/>
  <path d="M52 104q-14 8-13 25" fill="none" stroke="#1654a5" stroke-linecap="round" stroke-width="7"/>
  <circle cx="39" cy="131" r="6" fill="#ffc857" stroke="#1654a5" stroke-width="3"/>
  <g class="arm">
    <path d="M108 104q17 0 20-17" fill="none" stroke="#1654a5" stroke-linecap="round" stroke-width="7"/>
    <circle cx="130" cy="83" r="7" fill="#ffc857" stroke="#1654a5" stroke-width="3"/>
    <circle cx="137" cy="76" r="14" fill="#eaf3ff" stroke="#2574db" stroke-width="4"/>
    <path d="m147 87 8 8" stroke="#1654a5" stroke-linecap="round" stroke-width="5"/>
  </g>
  <g class="left-leg">
    <path d="M65 145v20" stroke="#1654a5" stroke-linecap="round" stroke-width="7"/>
    <path d="M65 164q-12 0-12 8h20q1-6-8-8" fill="#f38181" stroke="#1654a5" stroke-linejoin="round" stroke-width="3"/>
  </g>
  <g class="right-leg">
    <path d="M95 145v20" stroke="#1654a5" stroke-linecap="round" stroke-width="7"/>
    <path d="M95 164q12 0 12 8H87q-1-6 8-8" fill="#f38181" stroke="#1654a5" stroke-linejoin="round" stroke-width="3"/>
  </g>
</svg>