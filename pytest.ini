[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
	swagger_section(name): Swagger section name used for dashboard grouping.
	swagger_operation(name): Swagger operation or endpoint label shown in the dashboard.
	testrail_case(case_id): TestRail case ID associated with the pytest case.
	dashboard_title(title): Human-readable title shown in the dashboard.
